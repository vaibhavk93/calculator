<style>
body{margin:0;background:#060606}
.row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #262626;width:100%;box-sizing:border-box;text-align:left;background:none;border-left:none;border-right:none;border-top:none;color:#F5F5F5;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
.row:last-child{border-bottom:none}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#818181;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#CCD539}
.chip{all:unset;padding:9px 14px;border-radius:20px;border:1px solid #262626;background:#181818;color:#F5F5F5;font-size:0.8rem;white-space:nowrap;cursor:pointer}
.tile{all:unset;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex-shrink:0;cursor:pointer}
.tile-ic{width:44px;height:44px;border-radius:10px;background:#181818;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile-lbl{font-size:0.7rem;color:#F5F5F5;text-align:center;line-height:1.2}
</style>
</helmet>

    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
