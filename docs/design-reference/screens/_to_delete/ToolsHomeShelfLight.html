.row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #DEDEDE;width:100%;box-sizing:border-box;text-align:left;background:none;border-left:none;border-right:none;border-top:none;color:#121212;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}

      <button class="card">

        <span style="font-size:0.72rem;color:#5D5D5D;line-height:1.4">Income tax, HRA, in-hand +4</span>

    <button class="row"><span style="width:10px;height:10px;border-radius:50%;background:#6FA8DC;flex-shrink:0"></span><span style="flex:1;font-size:0.95rem">Business</span><span class="mono" style="font-family:'IBM Plex Mono';color:#5D5D5D;font-size:0.82rem">6</span></button>
    <button class="row"><span style="width:10px;height:10px;border-radius:50%;background:#9C7CF2;flex-shrink:0"></span><span style="flex:1;font-size:0.95rem">Health &amp; home</span><span class="mono" style="font-family:'IBM Plex Mono';color:#5D5D5D;font-size:0.82rem">6</span></button>

    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
