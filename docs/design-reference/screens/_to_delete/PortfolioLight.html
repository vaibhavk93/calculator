<!doctype html>

<x-dc>
<helmet>

<style>

.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

<div style="width:390px;height:844px;background:#FFFFFF;color:#121212;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;gap:8px;padding:18px 16px 4px">
    <button aria-label="Back to Budget" style="all:unset;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span style="flex:1;font-weight:600;font-size:1.05rem">Portfolio</span>

    <div style="padding:14px 20px 6px;display:flex;flex-direction:column;gap:4px">

      <div class="mono" style="font-size:2.4rem;font-weight:500;line-height:1;color:#BE241F">−₹14,05,000</div>
      <div style="font-size:0.84rem;color:#525252;margin-top:2px">Liabilities are currently larger than assets</div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;padding:12px 20px;margin:14px 20px 0;background:#F7F7F7;border:1px solid #DEDEDE;border-radius:10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9" stroke="#BE241F" stroke-width="1.8"/><path d="M12 7v6l4 2" stroke="#BE241F" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size:0.82rem;color:#BE241F">3 of 8 values are older than 30 days</span>
    </div>

    <div style="padding:22px 20px 6px;font-size:0.78rem;color:#525252">Split by kind</div>
    <div style="padding:0 20px 20px">
      <div style="display:flex;height:12px;border-radius:4px;overflow:hidden">
        <div style="width:33%;background:#121212"></div>
        <div style="width:21%;background:#5EC8C8"></div>
        <div style="width:35%;background:#7C8CF2"></div>
        <div style="width:5%;background:#D9B88A"></div>
        <div style="width:6%;background:#C98FD6"></div>
      </div>
    </div>

    <div style="padding:0 20px 6px;font-size:0.78rem;color:#525252">6-month trend</div>
    <div style="padding:0 20px 20px;display:flex;align-items:flex-end;gap:8px;height:56px">
      <div style="width:100%;height:30%;background:#DEDEDE;border-radius:3px"></div>
      <div style="width:100%;height:38%;background:#DEDEDE;border-radius:3px"></div>
      <div style="width:100%;height:46%;background:#DEDEDE;border-radius:3px"></div>
      <div style="width:100%;height:42%;background:#DEDEDE;border-radius:3px"></div>
      <div style="width:100%;height:55%;background:#DEDEDE;border-radius:3px"></div>
      <div style="width:100%;height:62%;background:#CCD539;border-radius:3px"></div>
    </div>

    <div style="font-size:0.78rem;color:#525252;padding:4px 20px 6px">Holdings · tap to update</div>

    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#121212;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">HDFC savings</div><div style="font-size:0.76rem;color:#5D5D5D;margin-top:2px">Bank · updated 2 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">₹3,25,000</span>
    </button>
    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#121212;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">Fixed deposit</div><div style="font-size:0.76rem;color:#5D5D5D;margin-top:2px">FD/RD · updated 12 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">₹5,00,000</span>
    </button>
    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#5EC8C8;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">Mutual funds</div><div style="font-size:0.76rem;color:#BE241F;margin-top:2px;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#BE241F" stroke-width="1.8"/><path d="M12 7v6l4 2" stroke="#BE241F" stroke-width="1.8" stroke-linecap="round"/></svg>Stocks &amp; MF · updated 41 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">₹8,40,000</span>
    </button>
    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#D9B88A;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">Gold</div><div style="font-size:0.76rem;color:#5D5D5D;margin-top:2px">updated 5 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">₹1,20,000</span>
    </button>
    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#7C8CF2;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">EPF</div><div style="font-size:0.76rem;color:#BE241F;margin-top:2px;display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#BE241F" stroke-width="1.8"/><path d="M12 7v6l4 2" stroke="#BE241F" stroke-width="1.8" stroke-linecap="round"/></svg>Retirement · updated 60 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">₹6,10,000</span>
    </button>
    <button class="row" style="width:100%;box-sizing:border-box;background:none;border-left:none;border-right:none;border-top:none;color:#121212;text-align:left;cursor:pointer;font-family:inherit">
      <span style="width:9px;height:9px;border-radius:50%;background:#BE241F;flex-shrink:0"></span>
      <div style="flex:1"><div style="font-size:0.92rem">Home loan</div><div style="font-size:0.76rem;color:#5D5D5D;margin-top:2px">Loan · updated 30 days ago</div></div>
      <span class="mono" style="font-size:0.9rem">−₹38,00,000</span>
    </button>

  </div>

</div>
