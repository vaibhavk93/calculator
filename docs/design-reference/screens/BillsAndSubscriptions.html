<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills &amp; subscriptions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060606}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#818181;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#CCD539}
.row{all:unset;display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #262626;width:100%;box-sizing:border-box;color:#F5F5F5;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
.row:last-child{border-bottom:none}
</style>
</helmet>
<div style="width:390px;height:844px;background:#060606;color:#F5F5F5;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;gap:8px;padding:18px 16px 10px">
    <button aria-label="Back to Budget" style="all:unset;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#F5F5F5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span style="font-weight:600;font-size:1.05rem">Bills &amp; subscriptions</span>
  </div>

  <div style="flex:1;overflow-y:auto">

    <div style="padding:14px 20px 4px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:0.82rem;color:#A4A4A4">Recurring spend</div>
      <div class="mono" style="font-size:2.3rem;font-weight:500;line-height:1">₹2,243<span style="font-size:1.1rem;color:#A4A4A4"> / mo</span></div>
      <div style="font-size:0.82rem;color:#A4A4A4;margin-top:4px">4 subscriptions, normalized to monthly</div>
    </div>

    <div style="font-size:0.78rem;color:#A4A4A4;padding:22px 20px 2px">Due this week</div>
    <button class="row">
      <span style="width:9px;height:9px;border-radius:50%;background:#EF675A;flex-shrink:0"></span>
      <span style="flex:1"><div style="font-size:0.93rem">Netflix</div><div style="font-size:0.78rem;color:#A4A4A4;margin-top:2px">Monthly · due in 3 days</div></span>
      <span class="mono" style="font-size:0.92rem">₹499</span>
    </button>
    <button class="row">
      <span style="width:9px;height:9px;border-radius:50%;background:#5EC8C8;flex-shrink:0"></span>
      <span style="flex:1"><div style="font-size:0.93rem">Spotify</div><div style="font-size:0.78rem;color:#A4A4A4;margin-top:2px">Monthly · due in 5 days</div></span>
      <span class="mono" style="font-size:0.92rem">₹119</span>
    </button>

    <div style="font-size:0.78rem;color:#A4A4A4;padding:18px 20px 2px">Later</div>
    <button class="row">
      <span style="width:9px;height:9px;border-radius:50%;background:#9C7CF2;flex-shrink:0"></span>
      <span style="flex:1"><div style="font-size:0.93rem">Cult.fit</div><div style="font-size:0.78rem;color:#A4A4A4;margin-top:2px">Monthly · due in 20 days</div></span>
      <span class="mono" style="font-size:0.92rem">₹1,500</span>
    </button>
    <button class="row">
      <span style="width:9px;height:9px;border-radius:50%;background:#D9B88A;flex-shrink:0"></span>
      <span style="flex:1"><div style="font-size:0.93rem">Amazon Prime</div><div style="font-size:0.78rem;color:#A4A4A4;margin-top:2px">Yearly · due in 45 days · ₹1,499 billed once</div></span>
      <span class="mono" style="font-size:0.92rem">₹125</span>
    </button>

    <div style="padding:20px 20px 12px">
      <button style="all:unset;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:#181818;border-radius:10px;padding:13px;font-size:0.88rem;color:#F5F5F5;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Add subscription</button>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid #262626;background:#0D0D0D">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Calculate</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6l-2.3 2.3-2-2 2.3-2.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Tools</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
