<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending summary — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#5D5D5D;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#5C6100}
.catrow{display:flex;flex-direction:column;gap:7px;padding:12px 20px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;color:#121212;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;gap:8px;padding:18px 16px 10px">
    <button aria-label="Back to Budget" style="all:unset;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#121212"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span style="font-weight:600;font-size:1.05rem">Spending summary</span>
  </div>

  <div style="flex:1;overflow-y:auto">

    <div style="padding:10px 20px 4px;display:flex;align-items:center;justify-content:center;gap:16px">
      <button aria-label="Previous month" style="all:unset;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#5D5D5D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span style="font-size:0.88rem;color:#525252">November 2026</span>
      <button aria-label="Next month" style="all:unset;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#5D5D5D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <div style="padding:14px 20px 4px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:0.82rem;color:#525252">Spent this month</div>
      <div class="mono" style="font-size:2.5rem;font-weight:500;line-height:1">₹14,700</div>
      <div style="font-size:0.82rem;color:#525252;margin-top:4px">12% more than October</div>
    </div>

    <div style="font-size:0.78rem;color:#525252;padding:24px 20px 2px">By category</div>

    <div class="catrow">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><span style="width:8px;height:8px;border-radius:50%;background:#E3B341;display:inline-block"></span>Food</span><span class="mono" style="font-size:0.92rem">₹8,000</span></div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden"><div style="width:54%;height:100%;background:#E3B341"></div></div>
    </div>
    <div class="catrow">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><span style="width:8px;height:8px;border-radius:50%;background:#6FA8DC;display:inline-block"></span>Travel</span><span class="mono" style="font-size:0.92rem">₹2,450</span></div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden"><div style="width:17%;height:100%;background:#6FA8DC"></div></div>
    </div>
    <div class="catrow">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><span style="width:8px;height:8px;border-radius:50%;background:#C98FD6;display:inline-block"></span>Bills</span><span class="mono" style="font-size:0.92rem">₹1,998</span></div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden"><div style="width:14%;height:100%;background:#C98FD6"></div></div>
    </div>
    <div class="catrow">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><span style="width:8px;height:8px;border-radius:50%;background:#7C8CF2;display:inline-block"></span>Shopping</span><span class="mono" style="font-size:0.92rem">₹1,502</span></div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden"><div style="width:10%;height:100%;background:#7C8CF2"></div></div>
    </div>
    <div class="catrow">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px;font-size:0.92rem"><span style="width:8px;height:8px;border-radius:50%;background:#8C8C8C;display:inline-block"></span>Other</span><span class="mono" style="font-size:0.92rem">₹750</span></div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden"><div style="width:5%;height:100%;background:#8C8C8C"></div></div>
    </div>

    <div style="font-size:0.78rem;color:#525252;padding:22px 20px 2px">Top merchants</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px"><span style="font-size:0.9rem">Swiggy</span><span class="mono" style="font-size:0.9rem;color:#525252">₹3,210</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px"><span style="font-size:0.9rem">Zomato</span><span class="mono" style="font-size:0.9rem;color:#525252">₹2,140</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px 20px"><span style="font-size:0.9rem">Uber</span><span class="mono" style="font-size:0.9rem;color:#525252">₹1,880</span></div>

  </div>

  <div style="display:flex;border-top:1px solid #DEDEDE;background:#F7F7F7">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Calculate</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6l-2.3 2.3-2-2 2.3-2.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Tools</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
