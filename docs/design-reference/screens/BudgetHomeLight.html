<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget home — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #DEDEDE;width:100%;box-sizing:border-box;text-align:left;background:none;border-left:none;border-right:none;border-top:none;color:#121212;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
.row:last-child{border-bottom:none}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#5D5D5D;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#5C6100}
.seg{all:unset;flex:1;text-align:center;padding:8px;border-radius:8px;font-size:0.82rem;color:#525252}
.seg.active{background:#CCD539;color:#121300;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;color:#121212;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:22px 20px 4px"><h1 style="margin:0;font-size:1.3rem;font-weight:600">Budget</h1></div>

  <div style="padding:14px 20px 0">
    <div style="display:flex;background:#F2F2F2;border-radius:10px;padding:3px">
      <button class="seg active">Spending</button><button class="seg">Net worth</button>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto">

    <div style="padding:16px 20px 4px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:0.82rem;color:#525252">Spent this month</div>
      <div class="mono" style="font-size:2.5rem;font-weight:500;line-height:1">₹14,700</div>
      <div style="font-size:0.84rem;color:#525252;margin-top:4px">Kept ₹18,400 of ₹90,000 that came in</div>
    </div>

    <div style="margin:22px 20px;background:#F7F7F7;border:1px solid #DEDEDE;border-radius:10px;overflow:hidden">
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;font-size:0.84rem;color:#525252"><span>Monthly limit</span><span class="mono" style="color:#121212">₹14,700 / ₹60,000</span></div>
        <div style="height:6px;background:#DEDEDE;border-radius:4px;overflow:hidden"><div style="width:24%;height:100%;background:#CCD539"></div></div>
      </div>
      <div style="height:1px;background:#DEDEDE"></div>
      <div style="padding:13px 18px">
        <div style="font-size:0.78rem;color:#525252;margin-bottom:8px">Needs attention</div>
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9" stroke="#BE241F" stroke-width="1.8"/><path d="M12 7v6" stroke="#BE241F" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.3" r="0.9" fill="#BE241F"/></svg>
          <span style="font-size:0.86rem;flex:1">Food — ₹8,000 limit, 92% used</span>
        </div>
      </div>
    </div>

    <div style="font-size:0.78rem;color:#525252;padding:4px 20px 6px">Recent entries</div>
    <button class="row"><span style="flex:1;font-size:0.92rem">Groceries<div style="font-size:0.74rem;color:#5D5D5D;margin-top:2px">Food · HDFC Salary</div></span><span class="mono" style="font-size:0.92rem">−₹1,200</span></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Netflix<div style="font-size:0.74rem;color:#5D5D5D;margin-top:2px">Bills · Tata Neo card</div></span><span class="mono" style="font-size:0.92rem">−₹999</span></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Goa trip — hotel<div style="font-size:0.74rem;color:#5D5D5D;margin-top:2px">Travel · Tata Neo card</div></span><span class="mono" style="font-size:0.92rem">−₹18,500</span></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Salary<div style="font-size:0.74rem;color:#5D5D5D;margin-top:2px">Money in · HDFC Salary</div></span><span class="mono" style="font-size:0.92rem;color:#1F7A3D">+₹90,000</span></button>

    <div style="font-size:0.78rem;color:#525252;padding:18px 20px 6px">More in Budget</div>
    <button class="row"><span style="flex:1;font-size:0.92rem">Spending summary</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#5D5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Bills &amp; subscriptions</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#5D5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Add from bank messages</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#5D5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Categories &amp; cards</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#5D5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="row"><span style="flex:1;font-size:0.92rem">Rules</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#5D5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <div style="padding:20px 20px 12px">
      <button style="all:unset;display:block;width:100%;text-align:center;background:#CCD539;color:#121300;font-weight:600;border-radius:10px;padding:14px;font-size:0.92rem">Add expense</button>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid #DEDEDE;background:#F7F7F7">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Calculate</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6l-2.3 2.3-2-2 2.3-2.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Tools</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
