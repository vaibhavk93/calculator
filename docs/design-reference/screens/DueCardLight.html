<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Due — Card view — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#5D5D5D;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#5C6100}
.seg{all:unset;flex:1;text-align:center;padding:7px;border-radius:8px;font-size:0.8rem;color:#525252}
.seg.active{background:#CCD539;color:#121300;font-weight:600}
.card{display:block;width:100%;box-sizing:border-box;background:#F7F7F7;border:1px solid #DEDEDE;border-radius:10px;padding:14px 16px;text-align:left;color:#121212;font-family:'IBM Plex Sans',sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;color:#121212;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:22px 20px 4px;display:flex;align-items:center;justify-content:space-between">
    <h1 style="margin:0;font-size:1.3rem;font-weight:600">Due</h1>
  </div>

  <div style="padding:14px 20px 4px;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:0.82rem;color:#525252">Amounts due in the next 30 days</div>
    <div class="mono" style="font-size:2.3rem;font-weight:500;line-height:1">₹64,590.16</div>
  </div>

  <div style="padding:14px 20px 10px">
    <div style="display:flex;background:#F2F2F2;border-radius:10px;padding:3px">
      <button class="seg">List</button><button class="seg active">Card</button>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:12px">

    <div style="font-size:0.76rem;color:#BE241F;font-weight:500;display:flex;align-items:center;gap:6px;margin-top:2px"><span style="width:7px;height:7px;border-radius:50%;background:#BE241F"></span>Overdue</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-size:0.95rem;font-weight:500">Renew car insurance</div>
        <button aria-label="More options" style="all:unset;color:#525252;font-size:0.76rem;cursor:pointer">More</button>
      </div>
      <div style="font-size:0.8rem;color:#BE241F;margin-top:6px">5 days overdue</div>
      <button style="all:unset;display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer" aria-label="Mark Renew car insurance done">
        <span class="chk" style="width:22px;height:22px;border-radius:50%;border:1.6px solid #5D5D5D;flex-shrink:0;display:inline-block"></span>
        <span style="font-size:0.8rem;color:#525252">Tap to mark done</span>
      </button>
    </div>

    <div style="font-size:0.76rem;color:#525252;margin-top:6px">This week</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:7px;font-size:0.95rem;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#7C8CF2"></span>Home loan EMI</div>
      </div>
      <div class="mono" style="font-size:1.4rem;font-weight:500;margin-top:8px">₹43,391.16</div>
      <div style="font-size:0.78rem;color:#525252;margin-top:4px">Due in 5 days</div>
      <button style="all:unset;display:block;width:100%;box-sizing:border-box;text-align:center;background:#F2F2F2;border-radius:8px;padding:10px;font-size:0.82rem;font-weight:500;margin-top:12px;cursor:pointer">Mark paid</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:7px;font-size:0.95rem;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#7C8CF2"></span>Car loan EMI</div>
      </div>
      <div class="mono" style="font-size:1.4rem;font-weight:500;margin-top:8px">₹43,391.16</div>
      <div style="font-size:0.78rem;color:#525252;margin-top:4px">Due in 6 days · 2 payments left</div>
      <div style="height:5px;background:#DEDEDE;border-radius:3px;overflow:hidden;margin-top:8px"><div style="width:92%;height:100%;background:#CCD539"></div></div>
      <button style="all:unset;display:block;width:100%;box-sizing:border-box;text-align:center;background:#F2F2F2;border-radius:8px;padding:10px;font-size:0.82rem;font-weight:500;margin-top:12px;cursor:pointer">Mark paid</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:7px;font-size:0.95rem;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#9C7A3E"></span>Pay credit card bill</div>
      </div>
      <div style="font-size:0.78rem;color:#525252;margin-top:8px">Monthly · due in 6 days · amount varies</div>
      <button style="all:unset;display:block;width:100%;box-sizing:border-box;text-align:center;background:#F2F2F2;border-radius:8px;padding:10px;font-size:0.82rem;font-weight:500;margin-top:12px;cursor:pointer">Mark paid</button>
    </div>

    <div style="font-size:0.76rem;color:#525252;margin-top:6px">Later</div>
    <div class="card">
      <div style="font-size:0.95rem;font-weight:500">Submit rent receipts</div>
      <div style="font-size:0.8rem;color:#525252;margin-top:6px">In 18 days</div>
      <button style="all:unset;display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer" aria-label="Mark Submit rent receipts done">
        <span style="width:22px;height:22px;border-radius:50%;border:1.6px solid #5D5D5D;flex-shrink:0;display:inline-block"></span>
        <span style="font-size:0.8rem;color:#525252">Tap to mark done</span>
      </button>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid #DEDEDE;background:#F7F7F7">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Calculate</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6l-2.3 2.3-2-2 2.3-2.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Tools</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
    <button class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
