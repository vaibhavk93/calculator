.row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #DEDEDE;width:100%;box-sizing:border-box;text-align:left;background:none;border-left:none;border-right:none;border-top:none;color:#121212;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}

.tab.active{color:#5C6100}
.tile{all:unset;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex-shrink:0;cursor:pointer}
.tile-ic{width:44px;height:44px;border-radius:10px;background:#F2F2F2;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.gic{width:36px;height:36px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center}
