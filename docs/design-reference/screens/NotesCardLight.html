<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes — Card view — light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.tab{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#5D5D5D;font-size:0.65rem;font-family:'IBM Plex Sans';cursor:pointer}
.tab.active{color:#5C6100}
.seg{all:unset;flex:1;text-align:center;padding:7px;border-radius:8px;font-size:0.8rem;color:#525252}
.seg.active{background:#CCD539;color:#121300;font-weight:600}
.card{all:unset;display:block;width:100%;box-sizing:border-box;background:#F7F7F7;border:1px solid #DEDEDE;border-radius:10px;padding:16px 18px;text-align:left;color:#121212;font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FFFFFF;color:#121212;font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between">
    <h1 style="margin:0;font-size:1.3rem;font-weight:600">Notes</h1>
    <button aria-label="Search notes" style="all:unset;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#121212"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>

  <div style="padding:0 20px 14px;display:flex;gap:10px">
    <div style="display:flex;background:#F2F2F2;border-radius:10px;padding:3px;flex:1">
      <button class="seg">List</button><button class="seg active">Card</button>
    </div>
    <button style="all:unset;background:#CCD539;color:#121300;border-radius:10px;padding:0 16px;font-size:0.85rem;font-weight:600;display:flex;align-items:center">+ New</button>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:14px">

    <button class="card">
      <div style="display:flex;align-items:center;gap:7px;font-size:0.95rem;font-weight:500"><svg width="11" height="11" viewBox="0 0 24 24" fill="#5C6100" aria-hidden="true"><path d="M12 2l2.6 6.9L21 9.3l-5.4 4.3L17 21l-5-3.6L7 21l1.4-7.4L3 9.3l6.4-.4Z"/></svg>Submit rent receipts</div>
      <div style="font-size:0.78rem;color:#5D5D5D;margin-top:6px">To-do · due in 3 days · 1 subtask open</div>
    </button>

    <button class="card">
      <div style="font-size:0.95rem;font-weight:500;margin-bottom:10px">Goa trip</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:0.84rem">
        <div style="display:flex;justify-content:space-between"><span style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;border:1.3px solid #5D5D5D;display:inline-block"></span>Hotel</span><span class="mono">₹18,500</span></div>
        <div style="display:flex;justify-content:space-between;color:#5D5D5D;text-decoration:line-through"><span style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:#5EC8C8;display:inline-block"></span>Flights</span><span class="mono">₹24,000</span></div>
      </div>
      <div style="height:1px;background:#DEDEDE;margin:10px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:0.86rem;font-weight:500"><span>Total · 2 of 4 items</span><span class="mono">₹42,500</span></div>
    </button>

    <button class="card">
      <div style="font-size:0.8rem;color:#525252;margin-bottom:6px">EMI calculation · Loan EMI</div>
      <div class="mono" style="font-size:1.7rem;font-weight:500">₹43,391</div>
      <div style="font-size:0.78rem;color:#5D5D5D;margin-top:4px">₹50,00,000 · 8.5% · 20 years</div>
    </button>

    <button class="card">
      <div style="font-size:0.9rem;line-height:1.5">Need to switch the home broadband plan before the Goa trip — compare ACT and Jio fibre</div>
      <div style="font-size:0.78rem;color:#5D5D5D;margin-top:8px">Note · 2 days ago</div>
    </button>

  </div>

  <div style="display:flex;border-top:1px solid #DEDEDE;background:#F7F7F7">
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>Calculate</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6l-2.3 2.3-2-2 2.3-2.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Tools</button>
    <button class="tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Notes</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Due</button>
    <button class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>Budget</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
