<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#060606" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <title>Calc</title>
    <!-- Paint the correct ground before any JS runs, so there is no white flash on cold start. -->
    <style>
      html, body { margin: 0; background: #060606; }
      @media (prefers-color-scheme: light) { html[data-theme="system"], html[data-theme="system"] body { background: #FFFFFF; } }
      html[data-theme="light"], html[data-theme="light"] body { background: #FFFFFF; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
